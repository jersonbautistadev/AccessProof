[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "accessproof"
version = "0.1.0"
description = "Configured authorization regression checks for local development and CI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
accessproof = "accessproof.__main__:main"

[tool.setuptools.packages.find]
include = ["accessproof*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
# The formatter owns line length; long string literals (HTML template, messages) stay intact.
# En dashes in user-facing ranges such as "1–30" are intentional.
ignore = ["E501", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["accessproof", "scripts", "tests"]
