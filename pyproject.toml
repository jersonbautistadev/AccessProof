[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "accessproof"
version = "0.1.0"
description = "Configured authorization regression checks for local development and CI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
accessproof = "accessproof.__main__:main"

[tool.setuptools.packages.find]
include = ["accessproof*"]
