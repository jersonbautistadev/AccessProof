version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Hash-pinned CI-only tools (coverage, ruff); the package itself has no dependencies.
  - package-ecosystem: pip
    directory: /ci
    schedule:
      interval: monthly
  # Report viewer (web/). Grouped so routine updates arrive as one pull request.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      viewer:
        patterns: ["*"]
