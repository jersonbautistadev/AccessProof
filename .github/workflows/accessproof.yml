name: AccessProof

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test the runner and its local fixtures
        run: python -m unittest discover -v
      - name: Run required authorization checks against the corrected local demo
        # No continue-on-error, shell pipeline, or exit-code masking.
        # The helper starts the loopback demo and returns the real CLI's exit code.
        run: python -m scripts.ci_demo
      - name: Preserve sanitized evidence even after a failed check
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessproof-report
          path: |
            reports/ci/report.json
            reports/ci/report.html
          if-no-files-found: warn
          retention-days: 7
