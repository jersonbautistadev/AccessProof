name: AccessProof

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test the runner and its local fixtures
        run: python -m unittest discover -v
      - name: Run required authorization checks against the corrected local demo
        # No continue-on-error, shell pipeline, or exit-code masking.
        # The helper starts the loopback demo and returns the real CLI's exit code.
        run: python -m scripts.ci_demo
      - name: Preserve sanitized evidence even after a failed check
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accessproof-report
          path: |
            reports/ci/report.json
            reports/ci/report.html
          if-no-files-found: warn
          retention-days: 7
