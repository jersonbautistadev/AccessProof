name: AccessProof

on:
  # Branch pushes are covered by their pull request; running both doubled every PR's checks.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessproof-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Keep this job's name stable: branch protection should require "AccessProof / authorization".
  # It deliberately has no `needs:`. A required check skipped by a failed dependency counts as passing.
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install hash-pinned CI tools
        run: python -m pip install --require-hashes --no-deps -r ci/requirements.txt
      - name: Test the runner and its local fixtures, with a branch-coverage floor
        run: |
          python -m coverage run -m unittest discover -v
          python -m coverage report
      - name: Run required authorization checks against the corrected local demo
        # No continue-on-error, shell pipeline, or exit-code masking.
        # The helper starts the loopback demo and returns the real CLI's exit code.
        run: python -m scripts.ci_demo
      - name: Verify the vulnerable -> fixed -> regression walkthrough
        run: python -m scripts.walkthrough
      - name: Preserve sanitized evidence even after a failed check
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessproof-report
          path: |
            reports/ci/report.json
            reports/ci/report.html
            reports/walkthrough/
          if-no-files-found: warn
          retention-days: 7

  compatibility:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared minimum (tomllib); 3.12 is the reference version used above.
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python -m unittest discover -v

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install hash-pinned CI tools
        run: python -m pip install --require-hashes --no-deps -r ci/requirements.txt
      - name: Lint
        run: ruff check --output-format=github .
      - name: Check formatting
        run: ruff format --check .

  # Report viewer (web/): type check, tests, and a production build with its CSP.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact locked dependencies
        run: npm ci --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Keep the built viewer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessproof-viewer
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
